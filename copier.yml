# Copier template for bastgau's Home Assistant custom integrations.
#
#   uvx --from copier copier copy gh:bastgau/ha-dev-environment <target>   # first time
#   uvx --from copier copier update                                         # later, from the target
_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
# Read from the repository itself: what it adds to the issue forms (see .github/.issue-extra.yml).
_external_data:
  issue_extra: .github/.issue-extra.yml
# Seeded once, never overwritten: generated per repository (HA version dependent), or
# owned by the repository once created (project-specific fields of the bug report,
# the tests some repositories vendor from Home Assistant core, a first test to start from,
# the README, the HACS file, the integration skeleton and the local .env holding your token).
_skip_if_exists:
  - README.md
  - hacs.json
  - custom_components/*/__init__.py
  - custom_components/*/manifest.json
  - .devcontainer/.env
  - .devcontainer/requirements-default-config.txt
  - .github/.issue-extra.yml
  - tests/__init__.py
  - tests/conftest.py
  - tests/test_integration_loads.py
  - custom_components/*/*/__init__.py
  - tests/**/__init__.py
  - tests/**/test_integration_loads.py

# The issue templates became issue forms (.yml): drop the Markdown ones a repository
# generated before. Runs only on `copier update` from a release older than this version.
_migrations:
  - version: v0.23.0
    command: rm -f .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md

integration_domain:
  type: str
  help: Integration domain (name of the custom_components/<domain> folder)
  validator: >-
    {% if not (integration_domain | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores only
    {% endif %}

integration_name:
  type: str
  help: Display name of the integration

repo_name:
  type: str
  help: GitHub repository name, also the devcontainer workspace folder
  default: "ha-{{ integration_domain | replace('_', '-') }}"

description:
  type: str
  help: One-line project description (pyproject.toml)

client_package:
  type: str
  help: >-
    Name of the API client package bundled inside custom_components/<domain>/
    (leave empty when there is none)
  default: ""

client_tests_path:
  type: str
  help: Folder holding the client's own tests (only used when there is a client)
  default: "tests/{{ integration_domain }}/{{ client_package }}"
  when: "{{ client_package != '' }}"

ha_minimum_version:
  type: str
  help: Minimum Home Assistant version the integration supports (the homeassistant key of hacs.json), shown as a warning in the bug report
  default: "2026.10.0"
  validator: >-
    {% if not (ha_minimum_version | regex_search('^[0-9]{4}\\.[0-9]+\\.[0-9]+$')) %}
    Use a Home Assistant version such as 2026.10.0
    {% endif %}

python_version:
  type: str
  help: Python version of the runtime (devcontainer, CI)
  default: "3.14"

python_requires:
  type: str
  help: requires-python of pyproject.toml (must satisfy the homeassistant pin, e.g. >=3.14.2)
  default: ">=3.14.2,<3.15"

github_owner:
  type: str
  help: GitHub account that owns the repository (project URLs, assignee of the pull request commands)
  default: "janedoe"

author_name:
  type: str
  help: Author and copyright holder (pyproject.toml authors and maintainers, LICENSE)
  default: "Jane Doe"

author_email:
  type: str
  help: Contact address of the author (pyproject.toml authors and maintainers)
  default: "jane.doe@example.com"

copyright_year:
  type: int
  help: >-
    Year the repository was created, the first year of the LICENSE copyright notice.
    Recorded once: on an existing repository, give it on the first update that asks
    (uvx --from copier copier update -d copyright_year=<year>), or the current year is taken.
  default: "{{ '%Y' | strftime }}"

coverage_fail_under:
  type: int
  help: >-
    Minimum test coverage, in percent, that scripts/test (and so CI) requires of each
    scope (client, integration). Lower it while a repository has few tests or none yet.
  default: 95
  validator: >-
    {% if coverage_fail_under < 0 or coverage_fail_under > 100 %}
    Give a percentage between 0 and 100
    {% endif %}
